<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #7a7a80; --line: #e6e4df;
    --empty: #ecebe7; --accent: #2f7d5b; --danger: #c2453d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1e1e21; --ink: #f2f2f3; --muted: #9a9aa2; --line: #2c2c31; --empty: #2a2a2f; --accent: #4fb488; --danger: #e0675f; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .date { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .ring { position: relative; width: 56px; height: 56px; }
  .ring svg { transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); min-height: 16px; margin-bottom: 8px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .habit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .check { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--c); background: transparent;
           display: grid; place-items: center; cursor: pointer; transition: transform .1s, background .15s; }
  .check:active { transform: scale(.92); }
  .check svg { opacity: 0; transition: opacity .15s; }
  .check.on { background: var(--c); }
  .check.on svg { opacity: 1; }
  .info { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .week { display: flex; gap: 6px; margin-top: 12px; }
  .day { flex: 1; text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
  .day b { display: block; height: 28px; border-radius: 8px; background: var(--empty); margin-top: 4px; transition: background .15s; }
  .day.on b { background: var(--c); }
  .day.today { color: var(--ink); font-weight: 600; }
  .day.future { opacity: .35; cursor: default; }
  .day.off, .cell.off { opacity: .35; cursor: default; }
  .day.slip b { background: transparent; box-shadow: inset 0 0 0 2px var(--danger); }
  .cell.slip { background: transparent; box-shadow: inset 0 0 0 2px var(--danger); color: var(--danger); }
  .check.slip { border-color: var(--danger); }
  .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c);
         border: 1px solid var(--c); border-radius: 6px; padding: 1px 5px; margin-right: 6px; vertical-align: 2px; }
  .hint { font-size: 12px; color: var(--muted); margin: -4px 0 12px; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 9px; border-radius: 9px; cursor: pointer; }
  .seg button.sel { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .since { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .sheet .since input { width: auto; padding: 8px 10px; }
  .formhint { font-size: 13px; margin: 10px 0 0 !important; }
  .wd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .details { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .stat strong { display: block; font-size: 20px; }
  .stat small { color: var(--muted); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 6px; background: var(--empty); cursor: pointer; display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .cell.on { background: var(--c); color: #fff; }
  .cell.future { visibility: hidden; }
  .cell.today { outline: 2px solid var(--ink); outline-offset: -2px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button.txt { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.txt.danger { color: var(--danger); border-color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .empty div { font-size: 40px; margin-bottom: 8px; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--accent); color: #fff; border: 0;
         border-radius: 999px; padding: 14px 24px; font: inherit; font-weight: 600; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.2); cursor: pointer; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 16px 28px; }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .sheet input { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .colors { display: flex; gap: 10px; margin: 14px 0 18px; flex-wrap: wrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatch.sel { border-color: var(--ink); }
  .sheet .btns { display: flex; gap: 10px; }
  .sheet .btns button { flex: 1; padding: 12px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .sheet .btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sheet .btns button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .sheet p { color: var(--muted); margin: 0 0 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Habits</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="ring" id="ring"></div>
  </header>
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="addBtn">+ New habit</button>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const COLORS = ['#2f7d5b', '#3a6fd8', '#d9822b', '#c2453d', '#8a5cd1', '#1f9aa8', '#c9a227'];
const LS_KEY = 'habit-tracker-v1';
const WEEKDAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
let state = { habits: [], log: {} };   // log: { habitId: { 'YYYY-MM-DD': 1 } }
let expanded = null;
let docRef = null;

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

// ---------- stats ----------
// Build habits: log[id][day] = 1 means done.
// Quit habits:  every day from h.start counts as clean; log[id][day] = 1 means a slip.
const habit = id => state.habits.find(h => h.id === id);
const isQuit = h => h && h.type === 'quit';
const marked = (id, k) => !!(state.log[id] && state.log[id][k]);
const fromKey = k => new Date(k + 'T00:00:00');
function tracked(h, k) { return k <= key(today()) && (!isQuit(h) || k >= h.start); }
function isDone(id, k) {
  const h = habit(id);
  if (isQuit(h)) return tracked(h, k) && !marked(id, k);
  return marked(id, k);
}
function isSlip(id, k) { const h = habit(id); return isQuit(h) && tracked(h, k) && marked(id, k); }
function currentStreak(id) {
  let d = today(), n = 0;
  if (!isDone(id, key(d)) && !isQuit(habit(id))) d = addDays(d, -1); // unticked today doesn't break a build streak
  while (isDone(id, key(d))) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(id) {
  const h = habit(id), t = today();
  const keys = Object.keys(state.log[id] || {}).sort();
  const firstKey = isQuit(h) ? h.start : keys[0];
  if (!firstKey) return 0;
  let best = 0, run = 0;
  for (let d = fromKey(firstKey); d <= t; d = addDays(d, 1)) {
    run = isDone(id, key(d)) ? run + 1 : 0;
    best = Math.max(best, run);
  }
  return best;
}
function last30(id) {
  const h = habit(id), t = today();
  let c = 0, n = 0;
  for (let i = 0; i < 30; i++) {
    const k = key(addDays(t, -i));
    if (!tracked(h, k)) continue;
    n++; if (isDone(id, k)) c++;
  }
  return n ? Math.round(c / n * 100) : 0;
}

// ---------- storage ----------
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.habits) state = s; } catch (e) {} }

let writing = false, pending = false, saveTimer = null;
function save() {
  saveLocal();
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
async function flush() {
  if (writing) { pending = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(state))); setStatus(''); }
  catch (e) { setStatus(e && e.code === 'quota_exceeded' ? 'Storage is full — couldn’t save.' : 'Couldn’t sync — saved on this device.'); }
  writing = false;
  if (pending) { pending = false; flush(); }
}
function setStatus(t) { document.getElementById('status').textContent = t; }

async function initDb() {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) { setStatus('Saved on this device only.'); return; }
    const uid = await user.id();
    if (!uid) { setStatus('Sign in to sync across devices — saved on this device for now.'); return; }
    docRef = db.doc('data/users/' + uid + '/state');
    const timer = setTimeout(() => setStatus('Can’t reach sync yet — showing this device’s copy.'), 10000);
    docRef.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus(''); }
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists) {
        const d = snap.data();
        state = { habits: (d.habits || []).map(h => ({ ...h })), log: JSON.parse(JSON.stringify(d.log || {})) };
        saveLocal(); render();
      } else if (!snap.metadata.fromCache && state.habits.length) {
        flush(); // first sync: upload this device's habits
      }
    }, () => { clearTimeout(timer); setStatus('Sync stopped — changes are saved on this device.'); docRef = null; });
  } catch (e) { setStatus('Saved on this device only.'); }
}

// ---------- actions ----------
function toggle(id, k) {
  if (!tracked(habit(id), k)) return;
  state.log[id] = state.log[id] || {};
  if (state.log[id][k]) delete state.log[id][k]; else state.log[id][k] = 1;
  save(); render();
}
function addHabit(name, color, type, start) {
  const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const h = { id, name, color };
  if (type === 'quit') { h.type = 'quit'; h.start = start; }
  state.habits.push(h);
  save(); render();
}
function updateHabit(id, name, color, start) {
  const h = habit(id); if (!h) return;
  h.name = name; h.color = color;
  if (isQuit(h) && start) h.start = start;
  save(); render();
}
function deleteHabit(id) {
  state.habits = state.habits.filter(h => h.id !== id);
  delete state.log[id]; expanded = null; save(); render();
}
function move(id, dir) {
  const i = state.habits.findIndex(h => h.id === id), j = i + dir;
  if (j < 0 || j >= state.habits.length) return;
  [state.habits[i], state.habits[j]] = [state.habits[j], state.habits[i]];
  save(); render();
}

// ---------- render ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const checkSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function render() {
  const t = today(), tk = key(t);
  document.getElementById('date').textContent = t.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

  const total = state.habits.length, done = state.habits.filter(h => isDone(h.id, tk)).length;
  const r = 24, circ = 2 * Math.PI * r, frac = total ? done / total : 0;
  document.getElementById('ring').innerHTML = `
    <svg width="56" height="56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--empty)" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - frac)}" style="transition:stroke-dashoffset .3s"/></svg>
    <span>${done}/${total}</span>`;

  const list = document.getElementById('list');
  if (!total) {
    list.innerHTML = `<div class="empty"><div>🌱</div>No habits yet.<br>Tap <b>+ New habit</b> to build a good one or quit a bad one.</div>`;
    return;
  }
  const dayClass = (h, k) => [isDone(h.id, k) ? 'on' : '', isSlip(h.id, k) ? 'slip' : '', k === tk ? 'today' : '', tracked(h, k) ? '' : 'off'].join(' ');
  const dayData = (h, k) => tracked(h, k) ? `data-t="${h.id}" data-k="${k}"` : '';
  list.innerHTML = state.habits.map((h, idx) => {
    const quit = isQuit(h), on = isDone(h.id, tk), streak = currentStreak(h.id);
    let week = '';
    const monday = addDays(t, -((t.getDay() + 6) % 7));
    for (let i = 0; i < 7; i++) {
      const k = key(addDays(monday, i));
      week += `<div class="day ${dayClass(h, k)}" ${dayData(h, k)}>${WEEKDAYS[i]}<b></b></div>`;
    }
    let meta;
    if (quit) {
      meta = isSlip(h.id, tk) ? 'Slipped today — tap ✓ to undo'
        : `🛡️ ${streak} day${streak === 1 ? '' : 's'} clean`;
    } else {
      meta = streak ? `🔥 ${streak} day${streak > 1 ? 's' : ''} streak` : 'No streak yet';
    }
    let details = '';
    if (expanded === h.id) {
      // 5 weeks, aligned Mon–Sun, ending this week
      const dow = (t.getDay() + 6) % 7; const start = addDays(t, -dow - 28);
      let cells = '';
      for (let i = 0; i < 35; i++) {
        const d = addDays(start, i), k = key(d);
        cells += `<div class="cell ${dayClass(h, k)} ${d > t ? 'future' : ''}" ${dayData(h, k)}>${d.getDate()}</div>`;
      }
      details = `<div class="details">
        <div class="stats">
          <div class="stat"><strong>${streak}</strong><small>${quit ? 'Days clean' : 'Current streak'}</small></div>
          <div class="stat"><strong>${bestStreak(h.id)}</strong><small>${quit ? 'Longest clean' : 'Best streak'}</small></div>
          <div class="stat"><strong>${last30(h.id)}%</strong><small>${quit ? 'Clean, last 30 days' : 'Last 30 days'}</small></div>
        </div>
        ${quit ? `<div class="hint">Quitting since ${fromKey(h.start).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}. Every day counts as clean unless you tap it to mark a slip.</div>` : ''}
        <div class="grid">${WEEKDAYS.map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>
        <div class="actions">
          <button class="txt" data-edit="${h.id}">Edit</button>
          ${idx > 0 ? `<button class="txt" data-up="${h.id}">↑</button>` : ''}
          ${idx < total - 1 ? `<button class="txt" data-down="${h.id}">↓</button>` : ''}
          <span style="flex:1"></span>
          <button class="txt danger" data-del="${h.id}">Delete</button>
        </div></div>`;
    }
    return `<div class="habit" style="--c:${esc(h.color)}">
      <div class="row">
        <button class="check ${on ? 'on' : ''} ${isSlip(h.id, tk) ? 'slip' : ''}" ${dayData(h, tk)} aria-label="${quit ? (on ? 'Mark a slip today for ' : 'Undo slip today for ') : 'Mark done today: '}${esc(h.name)}">${checkSvg}</button>
        <div class="info" data-x="${h.id}">
          <div class="name">${quit ? '<span class="tag">Quit</span>' : ''}${esc(h.name)}</div>
          <div class="meta">${meta}</div>
        </div>
      </div>
      <div class="week">${week}</div>${details}</div>`;
  }).join('');
}

// ---------- sheet (add / edit / delete) ----------
const sheetBg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
function closeSheet() { sheetBg.classList.remove('open'); }
function openForm(h) {
  let color = h ? h.color : COLORS[state.habits.length % COLORS.length];
  let type = h ? (isQuit(h) ? 'quit' : 'build') : 'build';
  const tk = key(today());
  sheet.innerHTML = `<h2>${h ? 'Edit habit' : 'New habit'}</h2>
    <form id="f">
    ${h ? '' : `<div class="seg" id="seg">
      <button type="button" data-type="build" class="sel">Build a habit</button>
      <button type="button" data-type="quit">Quit a habit</button></div>`}
    <input id="nm" maxlength="60" value="${h ? esc(h.name) : ''}" autocomplete="off">
    <label class="since" id="sinceRow" style="display:${type === 'quit' ? 'flex' : 'none'}">Quitting since
      <input type="date" id="since" max="${tk}" value="${h && isQuit(h) ? h.start : tk}"></label>
    <p class="formhint" id="fh"></p>
    <div class="colors">${COLORS.map(c => `<div class="swatch ${c === color ? 'sel' : ''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div>
    <div class="btns"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">${h ? 'Save' : 'Add'}</button></div></form>`;
  sheetBg.classList.add('open');
  const nm = document.getElementById('nm'), since = document.getElementById('since');
  const syncType = () => {
    nm.placeholder = type === 'quit' ? 'e.g. No smoking' : 'e.g. Read 20 minutes';
    document.getElementById('sinceRow').style.display = type === 'quit' ? 'flex' : 'none';
    document.getElementById('fh').textContent = type === 'quit'
      ? 'Each day is checked automatically. Tap a day only if you slipped.' : 'Tap the check each day you do it.';
  };
  syncType();
  setTimeout(() => nm.focus(), 50);
  const seg = document.getElementById('seg');
  if (seg) seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    type = b.dataset.type; seg.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); syncType();
  });
  sheet.querySelectorAll('.swatch').forEach(s => s.onclick = () => {
    color = s.dataset.c; sheet.querySelectorAll('.swatch').forEach(x => x.classList.toggle('sel', x === s));
  });
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const name = nm.value.trim(); if (!name) { nm.focus(); return; }
    let start = /^\d{4}-\d{2}-\d{2}$/.test(since.value) ? since.value : tk;
    if (start > tk) start = tk;
    h ? updateHabit(h.id, name, color, start) : addHabit(name, color, type, start);
    closeSheet();
  };
}
function openDelete(h) {
  sheet.innerHTML = `<h2>Delete “${esc(h.name)}”?</h2><p>Its whole history will be removed. This can’t be undone.</p>
    <div class="btns"><button id="cancel">Cancel</button><button class="danger" id="ok">Delete</button></div>`;
  sheetBg.classList.add('open');
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('ok').onclick = () => { deleteHabit(h.id); closeSheet(); };
}
sheetBg.addEventListener('click', e => { if (e.target === sheetBg) closeSheet(); });
document.getElementById('addBtn').onclick = () => openForm(null);

// ---------- events ----------
document.getElementById('list').addEventListener('click', e => {
  const el = e.target.closest('[data-t],[data-x],[data-edit],[data-del],[data-up],[data-down]');
  if (!el) return;
  const d = el.dataset, find = id => state.habits.find(h => h.id === id);
  if (d.t) toggle(d.t, d.k);
  else if (d.x) { expanded = expanded === d.x ? null : d.x; render(); }
  else if (d.edit) openForm(find(d.edit));
  else if (d.del) openDelete(find(d.del));
  else if (d.up) move(d.up, -1);
  else if (d.down) move(d.down, 1);
});

// re-render at midnight / when app comes back to the foreground
let lastDay = key(today());
document.addEventListener('visibilitychange', () => { if (!document.hidden && key(today()) !== lastDay) { lastDay = key(today()); render(); } });

loadLocal();
render();
if (window.claude && claude.use) initDb(); else setStatus('Saved on this device only.');
</script>
</body>
</html>
